[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oddssea"
dynamic = ["version"]
description = "Python client for the oddssea API: Pinnacle odds, prematch and live, over REST and WebSocket."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "oddssea", email = "hello@oddssea.dev" }]
keywords = ["pinnacle", "odds", "ps3838", "betting", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://oddssea.dev"
Documentation = "https://oddssea.dev/docs"
Source = "https://github.com/oddssea/oddssea-python"

[tool.hatch.version]
path = "src/oddssea/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
