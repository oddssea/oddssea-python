name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" build
      - run: pytest
      - run: test "v$(python -c 'import oddssea; print(oddssea.__version__)')" = "$GITHUB_REF_NAME"
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
